name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow websockets mss pywin32
      - name: Build Inka.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Inka
          --add-data "mirrorindex.html;."
          --hidden-import PIL --hidden-import websockets --hidden-import asyncio
          --hidden-import mss --hidden-import win32gui --hidden-import win32ui
          --hidden-import win32api --hidden-import win32con --hidden-import pywintypes
          inka.py
      - uses: actions/upload-artifact@v4
        with:
          name: Inka-windows
          path: dist/Inka.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow websockets mss pyautogui pyobjc-core pyobjc-framework-Quartz
      - name: Build Inka.app
        run: >
          pyinstaller --noconfirm --windowed --name Inka
          --add-data "mirrorindex.html:."
          --hidden-import PIL --hidden-import websockets --hidden-import asyncio
          --hidden-import mss --hidden-import pyautogui --hidden-import Quartz
          inka.py
      - name: Package DMG
        run: hdiutil create -volname Inka -srcfolder "dist/Inka.app" -ov -format UDZO "dist/Inka.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Inka-macos
          path: dist/Inka.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install pyinstaller pillow websockets mss pyautogui python-xlib
      - name: Build inka binary
        run: >
          pyinstaller --noconfirm --onefile --name inka
          --add-data "mirrorindex.html:."
          --hidden-import PIL --hidden-import websockets --hidden-import asyncio
          --hidden-import mss --hidden-import pyautogui
          inka.py
      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.1.0"
          PKG="inka_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp dist/inka "$PKG/usr/bin/inka"
          chmod 755 "$PKG/usr/bin/inka"
          printf 'Package: inka\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nRecommends: wmctrl\nMaintainer: PrahaladaSumiranTechlabs <noreply@users.noreply.github.com>\nDescription: Inka - live second screen and remote control for any device\n' "$VERSION" > "$PKG/DEBIAN/control"
          printf '[Desktop Entry]\nName=Inka\nExec=/usr/bin/inka\nType=Application\nCategories=Utility;\nTerminal=false\n' > "$PKG/usr/share/applications/inka.desktop"
          dpkg-deb --build --root-owner-group "$PKG"
          mv "${PKG}.deb" dist/Inka.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Inka-linux
          path: dist/Inka.deb

  release:
    needs: [windows, macos, linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Inka ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            **Inka — a live second screen + remote control for any device.**

            Downloads:
            - **Windows:** `Inka.exe` (double-click, no install)
            - **macOS:** `Inka.dmg` (open, drag Inka to Applications; grant Screen Recording + Accessibility)
            - **Linux:** `Inka.deb` (`sudo dpkg -i Inka.deb`, then run `inka`)

            What's new since v1.0.0: cross-platform (Windows/macOS/Linux), and
            per-device sources — multiple devices can each show and control a
            different screen at once.
          files: artifacts/**/*
